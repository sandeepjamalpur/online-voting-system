<svg viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the sweeping arch -->
    <linearGradient id="voteEaseArcGrad" x1="0%" y1="100%" x2="100%" y2="30%">
      <stop offset="0%" stop-color="#0066CC" />
      <stop offset="30%" stop-color="#0284C7" />
      <stop offset="65%" stop-color="#059669" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>

    <!-- Gradient for the leaf -->
    <linearGradient id="voteEaseLeafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
  </defs>

  <!-- 1. The Sweeping Gradient Arch (Counter-clockwise from bottom-left to bottom-right) -->
  <!-- Left tapered tip starting around (115, 280), sweeping up to (250, 65), and down to (405, 195) -->
  <path d="M 115 285 C 100 240 92 185 118 135 C 148 78 200 62 250 62 C 302 62 355 82 388 135 C 410 172 410 220 385 260 C 375 275 360 292 340 305 C 362 285 385 255 392 215 C 400 170 385 125 352 90 C 318 55 270 48 235 50 C 185 53 138 78 112 125 C 92 162 92 205 105 245 C 110 262 113 275 115 285 Z" fill="url(#voteEaseArcGrad)" />

  <!-- 2. The Leaf on the right edge -->
  <g transform="translate(382, 190) rotate(15)">
    <!-- Leaf Body with smooth organic curvature -->
    <path d="M 0 50 C 15 35 35 15 45 -15 C 30 0 10 10 -5 12 C -20 14 -32 25 -35 45 C -25 48 -10 50 0 50 Z" fill="url(#voteEaseLeafGrad)" />
    <!-- Leaf Center Split Line -->
    <path d="M 0 50 C 12 30 25 10 45 -15" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- 3. The Ballot Box Slot (Perspective Trapezoid in Deep Navy #0B1B36) -->
  <!-- Outer Rim of the Slot Base -->
  <path d="M 170 220 L 330 220 L 355 255 L 145 255 Z" fill="none" stroke="#0B1B36" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" />
  <!-- Inner Slot Opening Line -->
  <line x1="185" y1="240" x2="315" y2="240" stroke="#0B1B36" stroke-width="12" stroke-linecap="round" />

  <!-- 4. The Tilted Ballot Paper -->
  <g transform="rotate(-16 250 180)">
    <!-- White Paper Body with Navy Border -->
    <rect x="200" y="110" width="100" height="125" rx="10" fill="#FFFFFF" stroke="#0B1B36" stroke-width="16" stroke-linejoin="round" />
    <!-- Bold Navy Checkmark -->
    <path d="M 225 170 L 245 190 L 285 145" fill="none" stroke="#0B1B36" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- 5. Brand Wordmark "VoteEase" -->
  <text x="250" y="370" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="74" font-weight="800" letter-spacing="-1.5">
    <tspan fill="#0B1B36">Vote</tspan><tspan fill="#0284C7">Ease</tspan>
  </text>
</svg>