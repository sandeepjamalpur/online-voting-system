<svg viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sweeping Circular Gradient Arch from Blue to Green -->
    <linearGradient id="voteEaseArc" x1="100" y1="280" x2="400" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0066CC" />
      <stop offset="30%" stop-color="#0284C7" />
      <stop offset="65%" stop-color="#059669" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>

    <!-- Leaf Gradient -->
    <linearGradient id="voteEaseLeaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="60%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <!-- 1. SWEEPING GRADIENT ARCH (Blue to Green) -->
  <path d="M 112 284 C 95 240 88 185 116 132 C 146 76 200 60 250 60 C 302 60 356 80 390 132 C 412 168 414 212 392 252 C 378 276 355 298 328 312 C 352 292 376 265 384 230 C 394 186 384 142 354 104 C 322 66 274 58 238 60 C 188 62 142 86 116 132 C 96 168 96 210 108 248 C 112 264 114 276 112 284 Z" fill="url(#voteEaseArc)" />

  <!-- 2. LEAF STEM & ELEGANT SWOOSH UNDER 'EASE' -->
  <path d="M 390 200 C 405 240 395 290 365 330 C 345 356 315 375 280 382 C 320 372 355 348 375 315 C 398 278 402 232 390 200 Z" fill="#16A34A" />

  <!-- 3. GREEN LEAF (Positioned on the right side of the arc) -->
  <g transform="translate(390, 190)">
    <path d="M -8 26 C 8 20 28 8 42 -18 C 42 -18 36 10 18 24 C 0 38 -15 36 -24 32 C -20 28 -14 27 -8 26 Z" fill="url(#voteEaseLeaf)" />
    <path d="M -8 26 C 2 24 16 18 30 2 C 38 -6 42 -18 42 -18 C 30 -6 18 6 4 14 C -6 20 -8 26 -8 26 Z" fill="#4ADE80" fill-opacity="0.5" />
  </g>

  <!-- 4. BALLOT BOX SLOT (Previous Navy #0B1B36) -->
  <path d="M 172 218 L 328 218 L 354 256 L 146 256 Z" fill="#FFFFFF" stroke="#0B1B36" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" />
  <rect x="180" y="230" width="140" height="12" rx="6" fill="#0B1B36" />

  <!-- 5. TILTED BALLOT PAPER (Entering the Slot with Navy Border and Checkmark) -->
  <g transform="rotate(-17 250 180)">
    <rect x="198" y="108" width="104" height="128" rx="12" fill="#FFFFFF" stroke="#0B1B36" stroke-width="16" stroke-linejoin="round" />
    <path d="M 226 170 L 246 190 L 286 146" fill="none" stroke="#0B1B36" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- 6. TYPOGRAPHY: "Vote" in Previous Navy (#0B1B36) and "Ease" in Green (#0B3B2C) -->
  <text x="250" y="374" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="800" letter-spacing="-2">
    <tspan fill="#0B1B36">Vote</tspan><tspan fill="#0B3B2C">Ease</tspan>
  </text>
</svg>